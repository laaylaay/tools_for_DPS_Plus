  <!-- Middle hexagon -->
  <polygon points="128,56 196,90 196,150 128,184 60,150 60,90"
           fill="none" stroke="url(#g2)" stroke-width="2" opacity="0.7"/>

  <!-- Inner hexagon -->
  <polygon points="128,82 172,104 172,140 128,162 84,140 84,104"
           fill="url(#g2)" opacity="0.35"/>

  <!-- Plus cross -->
  <g transform="translate(128, 122)">
    <rect x="-22" y="-5.5" width="44" height="11" rx="4" fill="white" opacity="0.9"/>
    <rect x="-5.5" y="-22" width="11" height="44" rx="4" fill="white" opacity="0.9"/>
  </g>

  <!-- Accent dots - top -->
  <circle cx="128" cy="40" r="3" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="96" cy="52" r="2" fill="#DDD6FE" opacity="0.4"/>
  <circle cx="160" cy="52" r="2" fill="#DDD6FE" opacity="0.4"/>
</svg>
